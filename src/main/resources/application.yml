spring:
  application:
    name: Placeholder
  datasource:
    url: jdbc:mysql://localhost:3306/placeholder?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080

seat:
  hold:
    ttl-minutes: 5   # 좌석 홀드 유지 시간(분). 서버가 held_until = now + TTL로 설정
  expiry:
    scan-interval-ms: 60000   # 만료된 HELD 좌석 스캔 주기(ms). 스케줄러가 AVAILABLE로 해제

queue:
  # 입장 토큰 TTL(분). 홀드 TTL(5분)과 동일 — 만료 후 hold 시도 시 대기열 재진입
  entry-token-ttl-minutes: 5
  admission:
    # 동시 활성 세션(입장 토큰 보유) 전역 상한 (C). DB 풀이 아니라 앱 세션 용량 기준 — ADR-013.
    max-active-sessions: 200
    # 초당 입장 허용 수 전역 상한 (R). 유입 스파이크 평탄화.
    rate-per-second: 20
    scan-interval-ms: 1000   # 배치 입장 스케줄러 주기(ms). ceiling·rate 한도 내 대기열 → 입장 토큰 발급
  status:
    # 동적 폴링 주기 범위(ms). 서버가 (앞 인원 / rate) 예상 대기시간을 이 범위로 클램프해 내려준다.
    min-poll-ms: 2000
    max-poll-ms: 10000

jwt:
  secret: ${JWT_SECRET:placeholder-dev-secret-key-must-be-at-least-32-bytes!!}
  expiration-ms: 86400000

toss:
  # 결제 위젯용 공개 키(프론트 노출 가능). 주문 생성 응답으로 내려간다.
  client-key: ${TOSS_CLIENT_KEY:}
  # 서버 전용 시크릿 키(절대 노출·커밋 금지). confirm·조회 호출의 Basic Auth에 사용.
  secret-key: ${TOSS_SECRET_KEY:}
  api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
  # 외부 호출 상한. 토스가 응답하지 않을 때 요청 스레드가 무한 점유되는 것을 막는다(ADR-018).
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

payment:
  # 대사 — 동기 승인과 웹훅이 둘 다 실패한 결제를 주기적으로 찾아 보정한다 (ADR-018 삼중화)
  reconciliation:
    enabled: true
    interval-ms: 300000        # 보정 잡 주기 5분. 누락 결제는 빨리 고칠수록 좋다
    min-age-minutes: 5         # 이보다 최근 주문은 결제 진행 중일 수 있어 제외
    max-age-hours: 2           # 이보다 오래되면 사실상 고아 → 새벽 배치 소관(반복 조회 낭비 방지)
    batch-size: 100            # 한 번에 처리할 최대 건수(외부 호출 폭주 방지)
    # 고아 주문 만료는 새벽 배치에만 허용한다. 성급한 만료는 정상 결제를 거부하게 만들기 때문(ADR-018)
    expiry-cron: "0 0 4 * * *" # 새벽 4시 (스케줄러가 zone=Asia/Seoul 명시 — UTC 서버 함정 방지)
    expiry-age-hours: 24